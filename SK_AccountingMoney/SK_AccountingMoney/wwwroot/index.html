<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balance Telegram</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="mainScreen" class="screen">
        <div class="container">
            <div class="header">
                <h1>💰 Balance management</h1>
            </div>

            <div class="user-info">
                <h2 id="userName">Loading...</h2>
                <div class="balance-card">
                    <p class="balance-label">Current balance</p>
                    <p class="balance-amount" id="balanceAmount">0.00 €</p>
                </div>
            </div>

            <div class="actions">
                <div class="action-card">
                    <h3>➖ Withdraw money</h3>
                    <input type="number" id="withdrawAmount" placeholder="Sum" min="0" step="0.01">
                    <input type="text" id="withdrawDescription" placeholder="Description (optional)">
                    <button onclick="withdraw()" class="withdraw-btn">Withdraw</button>
                </div>
            </div>
            <div class="secondary-actions">
                <button onclick="openDepositModal()" class="secondary-btn deposit-color">
                    ➕ Top up balance
                </button>
                <button onclick="openHistoryModal()" class="secondary-btn history-color">
                    📋 Operation history
                </button>
                <button onclick="openExpensesModal()" class="secondary-btn expenses-color">
                    📊 Monthly expenses
                </button>
            </div>
        </div>
    </div>

    <div id="depositModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>➕ Top up balance</h2>
                <button class="close-btn" onclick="closeDepositModal()">&times;</button>
            </div>
            <div class="modal-body">
                <input type="number" id="depositAmount" placeholder="Sum" min="0" step="0.01">
                <input type="text" id="depositDescription" placeholder="Description (optional)">
                <button onclick="deposit()" class="deposit-btn">Top Up</button>
            </div>
        </div>
    </div>

    <div id="historyModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>📋 Operation history</h2>
                <button class="close-btn" onclick="closeHistoryModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div id="transactionsList" class="transactions-list">
                    <p class="loading">Loading...</p>
                </div>
            </div>
        </div>
    </div>

    <div id="expensesModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>📊 Monthly expenses</h2>
                <button class="close-btn" onclick="closeExpensesModal()">&times;</button>
            </div>
            <div class="modal-body">
                <input type="month" id="monthSelector" onchange="onMonthChange()"
                       class="month-selector">
            </div>
            <div class="expense-total-card">
                <p class="expense-label">Total expenses</p>
                <p class="expense-amount" id="totalExpensesAmount">0.00 €</p>
            </div>            
            <h3 class="expense-list-title">Transactions</h3>
            <div id="expensesList" class="transactions-list">
                <p class="loading">Loading...</p>
            </div>
        </div>
    </div>



    <div id="notification" class="notification"></div>

    <script src="app.js?v=1.0.03"></script>
</body>
</html>
